---
version: "2"

services:

  # --- PHP 8.3
  php:
    container_name: "invoiceplane-wiki-php"
    build: .
    volumes:
      - .:/app:delegated
      - ./resources/docker/php/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini:ro

  # --- nginx 1.16
  nginx:
    container_name: "invoiceplane-wiki-nginx"
    image: nginx:1.31-alpine
    ports:
      - "8080:8085"
    depends_on:
      - php
    volumes:
      - .:/app:delegated
      - ./resources/docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  invoiceplane-wiki-db:
    driver: local
